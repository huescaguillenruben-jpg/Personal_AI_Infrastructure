[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-card-lab"
version = "1.0.0"
description = "Educational, local-only payment card simulator with EMV, 3DS, tokenization, fraud, and clearing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "payment-card-lab" }]
keywords = ["payments", "emv", "iso8583", "3ds", "tokenization", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
stripe = ["stripe>=15.0"]
dev = ["mypy>=1.8", "ruff>=0.4"]

[project.scripts]
paylab = "cli:main"

[tool.setuptools.packages.find]
include = ["pailab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
